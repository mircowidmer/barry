name: Build and test

on:
  # Other branches run through their pull request; a push there too would run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authors:
    name: No commit by Claude
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: scripts/claude-commits.sh HEAD

  checks:
    name: Lint, types, Jest and Deno
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tsc needs expo-env.d.ts, which `npm start` writes on its first run and git ignores.
      - name: Write expo-env.d.ts
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test
      # Fails when a package drifts from the version the Expo SDK expects.
      - run: npx expo-doctor
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions/deliver
      - run: deno check supabase/functions/deliver/index.ts
      - run: deno test supabase/functions/deliver

  web:
    name: Trail Map web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/trail-map-site.sh

  backend:
    name: pgTAP and end-to-end against the local stack
    needs: changes
    # A gate that failed is no reason to skip, since a skipped job passes the required checks.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Applies every migration and supabase/seed.sql, which holds the Vault secrets deliver needs.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,vector,logflare
      - name: Start the text message relay
        run: |
          nohup node scripts/sms-relay.mjs > relay.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8788/messages > /dev/null && exit 0; sleep 1; done
          cat relay.log; exit 1
      # The doctor also waits for pg_cron's first tick, which can take up to a minute after the start.
      - name: Wait for the doctor
        run: |
          for _ in $(seq 1 18); do .claude/skills/barry-backend-verify/scripts/doctor.sh && exit 0; sleep 10; done
          exit 1
      - name: Check the generated database types
        run: |
          npx supabase gen types typescript --local > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts || { echo "::error::src/lib/database.types.ts is stale. Regenerate it as AGENTS.md says."; exit 1; }
      - run: npx supabase test db
      - run: npm run e2e
      - name: Collect the logs
        if: failure()
        run: |
          mkdir -p logs
          cp relay.log logs/ || true
          npx supabase status > logs/supabase-status.txt 2>&1 || true
          for c in supabase_edge_runtime_barry-local supabase_db_barry-local supabase_inbucket_barry-local; do
            docker logs "$c" > "logs/$c.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: backend-logs
          path: logs

  changes:
    name: Changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.diff.outputs.native }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # A pull request that changes none of what goes into the native project needs only its JavaScript bundle checked,
      # and one that changes none of what the stack, the e2e cases and the relay read needs no stack.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/changed-inputs.sh >> "$GITHUB_OUTPUT"

  ios-bundle:
    name: iOS JavaScript bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Take the production env from eas.json
        run: node -e "for (const [k, v] of Object.entries(require('./eas.json').build.production.env)) console.log(k + '=' + v)" >> "$GITHUB_ENV"
      - run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-bundle"
        env:
          APP_VARIANT: production

  ios:
    name: iOS Release build for the Simulator
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') }}
    # barry-mac, the self-hosted runner with the label ios, builds pushes to main and this repository's pull requests.
    # A pull request from a fork runs whatever code it brings, so it stays on a hosted runner.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-26' || 'ios' }}
    timeout-minutes: 60
    env:
      # The Podfile wraps clang in React Native's ccache script when USE_CCACHE is set at pod install.
      USE_CCACHE: '1'
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The hosted image has several Xcodes and needs one selected; the self-hosted Mac has its own.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable
      - run: brew install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      # The wrapper that pod install puts in CC runs `$CCACHE_BINARY clang`, and only the environment reaches the compiler.
      - run: |
          echo "CCACHE_BINARY=$(brew --prefix)/bin/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"
      # Every hosted build saves a new entry; the newest one any earlier run saved is restored. The self-hosted Mac keeps both directories on its disk.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/Library/Caches/ccache
            ~/Library/Caches/CocoaPods
          key: ios-build-${{ github.sha }}
          restore-keys: ios-build-
      # The counters travel with the cache and add up across runs; zeroed here, the stats after the build are this run's.
      - run: ccache --zero-stats
      # The self-hosted Mac's npm cache is its own ~/.npm, already on its disk; caching it would move gigabytes through the cache service.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - run: npm ci
      # The Release bundle embeds the EXPO_PUBLIC_ values, so it takes the hosted ones from the production profile.
      - name: Take the production env from eas.json
        run: node -e "for (const [k, v] of Object.entries(require('./eas.json').build.production.env)) console.log(k + '=' + v)" >> "$GITHUB_ENV"
      - name: Generate the iOS project
        run: npx expo prebuild --clean --platform ios
        env:
          APP_VARIANT: production
          BARRY_WITHOUT_PUSH: '1'
          LANG: en_US.UTF-8
      # One architecture proves the build; Release would otherwise compile everything for x86_64 as well.
      # The JavaScript bundle is the ios-bundle job's; here the serial bundle phase would only repeat it after the last compile.
      - name: Build
        run: >
          xcodebuild -workspace ios/Barry.xcworkspace -scheme Barry -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
        env:
          LANG: en_US.UTF-8
          SKIP_BUNDLING: '1'
          # CI has no Sentry token, and a build it proves is never shipped.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      - name: Show the compiler cache hits
        run: ccache --show-stats
