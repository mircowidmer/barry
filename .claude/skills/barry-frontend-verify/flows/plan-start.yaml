# The plan sheet of the test account, opened with Plan an Adventure: the refusal without a
# destination, Sara's warnings, then a Start with DEST.
appId: support.barry.dev
---
- tapOn: "Luca"
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Add a destination\\."
    timeout: 10000
- takeScreenshot: plan-refusal
- tapOn: "OK"
- scrollUntilVisible:
    element: "Sara"
    visibilityPercentage: 100
    centerElement: true
- tapOn: "Sara"
# Maestro reads a React Native checkbox as unchecked on iOS; its value says the truth.
- assertNotVisible: "checkbox, unchecked"
- takeScreenshot: plan-warnings
- scrollUntilVisible:
    element: "Destination"
    direction: UP
- tapOn:
    point: "360,248"
- inputText: "${DEST || 'Grosser Mythen'}"
- assertVisible: "${DEST || 'Grosser Mythen'}"
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Barry is watching\\..*"
    timeout: 20000
- takeScreenshot: plan-started
