# history-select in features/history.md: selects the two newest rows, whatever day they fall on, and deletes them.
appId: support.barry.dev
---
- tapOn: "Select"
- extendedWaitUntil:
    visible: "Select All"
    timeout: 5000
- tapOn:
    text: ".*, Checked in .*"
    index: 0
- tapOn:
    text: ".*, Checked in .*"
    index: 1
- assertVisible: "Delete \\(2\\)"
- takeScreenshot: history-select
- tapOn: "Delete \\(2\\)"
- extendedWaitUntil:
    visible: "Delete 2 Adventures\\?"
    timeout: 5000
- takeScreenshot: history-select-alert
- tapOn:
    point: "275,507"
- extendedWaitUntil:
    visible: "Select"
    timeout: 10000
- takeScreenshot: history-select-deleted
